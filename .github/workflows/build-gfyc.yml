# Custom multi-platform build for the gfyc / 官方远程 fork.
# Uses vanilla Flutter 3.38 (the code was adapted for it locally), no custom
# engine, no code signing. Builds Windows / macOS / Linux / Android — NOT iOS.
# Trigger manually (Actions tab -> Run workflow) or on push to master.
name: build-gfyc

concurrency:
  group: build-gfyc-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      android:
        description: '打包 Android (APK)'
        type: boolean
        default: true
      windows:
        description: '打包 Windows (EXE)'
        type: boolean
        default: true
      macos:
        description: '打包 macOS (DMG)'
        type: boolean
        default: false
      linux:
        description: '打包 Linux (DEB/RPM/AppImage)'
        type: boolean
        default: false
  push:
    branches: [master]
    paths-ignore:
      - "**.md"

env:
  FLUTTER_VERSION: "3.38.8"
  RUST_VERSION: "1.81.0"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_NDK_VERSION: "3.1.2"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # ---------------------------------------------------------------- macOS
  macos:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.macos) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[mac]')) }}
    runs-on: macos-14
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: brew install nasm yasm pkg-config create-dmg || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg deps (both arches for universal)
        run: |
          $VCPKG_ROOT/vcpkg install --triplet arm64-osx --x-install-root="$VCPKG_ROOT/installed"
          $VCPKG_ROOT/vcpkg install --triplet x64-osx --x-install-root="$VCPKG_ROOT/installed"
      - name: Generate bridge
        run: |
          (cd flutter && flutter pub get)
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build universal app (arm64 + x86_64)
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          # Build the Rust dylib for both arches, then lipo into a fat dylib so
          # the universal Flutter/Xcode build links on both Apple Silicon & Intel.
          cargo build --locked --features flutter --release --target aarch64-apple-darwin
          cargo build --locked --features flutter --release --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/liblibrustdesk.dylib \
            target/x86_64-apple-darwin/release/liblibrustdesk.dylib \
            -output target/release/liblibrustdesk.dylib
          cp target/release/liblibrustdesk.dylib target/release/librustdesk.dylib
          # No FLUTTER_XCODE_ARCHS => Flutter builds arm64 + x86_64 (universal).
          pushd flutter && flutter build macos --release && popd
          # Build a .dmg with a drag-to-Applications shortcut (hdiutil, no extra tools).
          rm -rf dmgroot && mkdir -p dmgroot
          cp -R "flutter/build/macos/Build/Products/Release/RustDesk.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "RustDesk" -srcfolder dmgroot -ov -format UDZO gfyc-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: gfyc-macos-universal
          path: gfyc-macos-universal.dmg

  # ---------------------------------------------------------------- Windows
  windows:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.windows) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[mac-android-only]') && !contains(github.event.head_commit.message, '[android-only]')) }}
    runs-on: windows-2022
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg deps
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: "$VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root=\"$VCPKG_ROOT/installed\""
      - name: Generate bridge
        shell: bash
        run: |
          (cd flutter && flutter pub get)
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked
          "$HOME/.cargo/bin/flutter_rust_bridge_codegen" --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build app
        shell: bash
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: python build.py --flutter --hwcodec
      - uses: actions/upload-artifact@v4
        with:
          name: gfyc-windows-x64
          path: |
            flutter/build/windows/x64/runner/Release/
            rustdesk-*.exe

  # ---------------------------------------------------------------- Linux
  linux:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.linux) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[mac-android-only]') && !contains(github.event.head_commit.message, '[android-only]') && !contains(github.event.head_commit.message, '[win-only]')) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpam0g-dev libpulse-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config tree wget yasm python3-pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg deps
        run: $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"
      - name: Generate bridge
        run: |
          (cd flutter && flutter pub get)
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build app (.deb)
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: python3 build.py --flutter --hwcodec
      - name: Build .rpm (from .deb via alien, best-effort)
        run: |
          sudo apt-get install -y alien || true
          sudo alien -r -k --scripts rustdesk-*.deb || true
          ls *.rpm || true
      - name: Build AppImage (best-effort)
        run: |
          set +e
          sudo apt-get install -y libfuse2 libarchive-tools
          sudo pip3 install git+https://github.com/rustdesk-org/appimage-builder.git
          cp rustdesk-*.deb appimage/rustdesk.deb
          pushd appimage
          sudo appimage-builder --skip-tests --recipe ./AppImageBuilder-x86_64.yml
          popd
          mv appimage/*.AppImage . 2>/dev/null || true
          ls *.AppImage || true
      - uses: actions/upload-artifact@v4
        with:
          name: gfyc-linux-x64
          path: |
            rustdesk-*.deb
            *.rpm
            *.AppImage

  # ---------------------------------------------------------------- Android (APK)
  android:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.android) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[win-only]')) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install build tools (for vcpkg)
        run: sudo apt-get update && sudo apt-get install -y nasm yasm ninja-build pkg-config gcc-multilib
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Build android native deps (vcpkg, arm64) — slow
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./flutter/build_android_deps.sh arm64-v8a
      - name: Generate bridge
        run: |
          (cd flutter && flutter pub get)
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build librustdesk.so (cargo-ndk, arm64) into jniLibs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Make bindgen-based build scripts (magnum-opus etc.) use the NDK
          # (bionic) sysroot instead of host glibc headers.
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        run: |
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          # Build without hwcodec: its build.rs cross-compile picks host headers
          # and fails; software codecs (vp9/aom) work fine for the controlled side.
          cargo ndk --platform 21 --target aarch64-linux-android build --release --features flutter
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/arm64-v8a/
      - name: Build APK
        run: |
          pushd flutter
          flutter build apk --release --target-platform android-arm64
          popd
      - uses: actions/upload-artifact@v4
        with:
          name: gfyc-android-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk

