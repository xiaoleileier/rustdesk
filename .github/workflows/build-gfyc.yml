# Custom multi-platform build for the gfyc / 官方远程 fork.
# Uses vanilla Flutter 3.38 (the code was adapted for it locally), no custom
# engine, no code signing. Builds Windows / macOS / Linux / Android — NOT iOS.
# Trigger manually (Actions tab -> Run workflow) or on push to master.
name: build-gfyc

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".github/workflows/**"

env:
  FLUTTER_VERSION: "3.38.8"
  RUST_VERSION: "1.81.0"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # ---------------------------------------------------------------- macOS
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: brew install nasm yasm pkg-config create-dmg || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg deps
        run: $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"
      - name: Generate bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build app
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          cargo build --locked --features flutter --release
          cp target/release/liblibrustdesk.dylib target/release/librustdesk.dylib
          pushd flutter && flutter build macos --release && popd
          create-dmg --overwrite "flutter/build/macos/Build/Products/Release/gfyc.app" . || true
          mkdir -p dist && cp -rf flutter/build/macos/Build/Products/Release/gfyc.app dist/ && (mv *.dmg dist/ 2>/dev/null || true)
      - uses: actions/upload-artifact@v4
        with:
          name: gfyc-macos-arm64
          path: dist/

  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg deps
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: $env:VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT/installed"
      - name: Generate bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build app
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: python build.py --flutter --hwcodec
      - uses: actions/upload-artifact@v4
        with:
          name: gfyc-windows-x64
          path: |
            flutter/build/windows/x64/runner/Release/
            rustdesk-*.exe

  # ---------------------------------------------------------------- Linux
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm libgtk-3-dev libxcb-randr0-dev libxdo-dev \
            libxfixes-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libpulse-dev \
            libpam0g-dev libclang-dev ninja-build libappindicator3-dev pkg-config \
            gstreamer1.0-plugins-base libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libva-dev libvdpau-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg deps
        run: $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"
      - name: Generate bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build app
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: python3 build.py --flutter --hwcodec
      - uses: actions/upload-artifact@v4
        with:
          name: gfyc-linux-x64
          path: rustdesk-*.deb

  # ---------------------------------------------------------------- Android (APK)
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Generate bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # Native libs for android are built by flutter/build_android.sh; this
          # may need vcpkg android deps — see flutter/build_android_deps.sh.
          pushd flutter
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          popd
      - uses: actions/upload-artifact@v4
        with:
          name: gfyc-android-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk
